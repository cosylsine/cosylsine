<!-- Typography inspired by aJupyter; animation adapted from DenverCoder1/readme-typing-svg. Licenses: assets/licenses/. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="50" viewBox="0 0 540 50" role="img" aria-labelledby="title desc">
  <title id="title">Retrieve better. Reason further.</title>
  <desc id="desc">Fira Code typing animation, with a static line when reduced motion is requested.</desc>
  <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
    .static { display: none; }
    @media (prefers-reduced-motion: reduce) { .typing { display: none; } .static { display: block; } }
  </style>
  <path id="typing-path" d="m0,25 h540">
    <animate id="type" attributeName="d" begin="0s;type.end" dur="6200ms" fill="remove" values="m0,25 h0;m0,25 h540;m0,25 h540;m0,25 h0" keyTimes="0;0.64516129032258;0.83870967741935;1"/>
  </path>
  <text class="typing" font-family="Fira Code, monospace" font-size="26" font-weight="400" fill="#087CA8" x="50%" text-anchor="middle" letter-spacing="normal"><textPath xlink:href="#typing-path">Retrieve better. Reason further.</textPath></text>
  <text class="static" x="270" y="25" text-anchor="middle" font-family="Fira Code, monospace" font-size="26" font-weight="400" fill="#087CA8">Retrieve better. Reason further.</text>
</svg>
