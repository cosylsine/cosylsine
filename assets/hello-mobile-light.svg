<svg xmlns="http://www.w3.org/2000/svg" width="420" height="152" viewBox="0 0 420 152" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Jiaxin Xu — cosylsine.</title>
  <desc id="desc">A short greeting with a blue cosine wave.</desc>
  <style>
    .cursor { animation: blink .8s step-end 3; }
    .wave { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.4s ease-out; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .wave { animation: none; } }
  </style>
  <text x="0" y="59" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="650" letter-spacing="-.8">Hi, I'm Jiaxin Xu.</text>
  <path class="cursor" d="M338 26V63" stroke="#185d9c" stroke-width="3"/>
  <path d="M0 112H410" fill="none" stroke="#d1d9e0" stroke-width="1"/>
  <path class="wave" d="M1 94C35 94 35 130 69 130S103 94 137 94S171 130 205 130S239 94 273 94S307 130 341 130S375 94 409 94" pathLength="1" fill="none" stroke="#185d9c" stroke-width="3" stroke-linecap="round"/>
</svg>
